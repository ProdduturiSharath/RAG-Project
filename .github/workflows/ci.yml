name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
       - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
      - run: ruff check src tests
      - run: mypy src tests
      - run: python -m pytest tests/unit -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
       - run: python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.lock
      - run: >-
          RAG_TEST_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres
          python -m pytest tests/integration -q -s
