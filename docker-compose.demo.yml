services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidence_rag_demo}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${RAG_DEMO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "127.0.0.1:${RAG_DEMO_API_PORT:-8000}:8000"
    environment:
      RAG_ENV: ${RAG_ENV:-development}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_STORAGE_BACKEND: postgres
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evidence_rag_demo}
      RAG_MIGRATIONS_PATH: /app/migrations
      RAG_DENSE_MODEL: ${RAG_DENSE_MODEL:-hash-v1}
      RAG_EMBEDDER_ID: ${RAG_EMBEDDER_ID:-hash-v1}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-token-overlap}
      RAG_GENERATION_BACKEND: ${RAG_GENERATION_BACKEND:-extractive}
      RAG_EXTRACTIVE_MINIMUM_SCORE: ${RAG_EXTRACTIVE_MINIMUM_SCORE:-0.0}
      RAG_JWT_ALGORITHM: ${RAG_JWT_ALGORITHM:-HS256}
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?copy .env.example to .env and set RAG_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "rag_service.storage.worker"]
    environment:
      RAG_ENV: ${RAG_ENV:-development}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_STORAGE_BACKEND: postgres
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evidence_rag_demo}
      RAG_MIGRATIONS_PATH: /app/migrations
      RAG_DENSE_MODEL: ${RAG_DENSE_MODEL:-hash-v1}
      RAG_EMBEDDER_ID: ${RAG_EMBEDDER_ID:-hash-v1}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-token-overlap}
      RAG_GENERATION_BACKEND: ${RAG_GENERATION_BACKEND:-extractive}
      RAG_EXTRACTIVE_MINIMUM_SCORE: ${RAG_EXTRACTIVE_MINIMUM_SCORE:-0.0}
      RAG_JWT_ALGORITHM: ${RAG_JWT_ALGORITHM:-HS256}
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?copy .env.example to .env and set RAG_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build: .
    command: ["streamlit", "run", "src/rag_service/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:${RAG_DEMO_UI_PORT:-8501}:8501"
    environment:
      RAG_UI_API_URL: http://api:8000
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?copy .env.example to .env and set RAG_JWT_SECRET}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_demo_data:
    name: ${RAG_DEMO_VOLUME:-evidence_rag_demo_pgdata}
