name: evidence-rag-final

services:
  api:
    build: .
    ports:
      - "127.0.0.1:${RAG_FINAL_API_PORT:-18010}:8000"
    environment:
      RAG_ENV: ${RAG_ENV:-development}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_STORAGE_BACKEND: postgres
      RAG_DATABASE_URL: ${RAG_CONTAINER_DATABASE_URL:?set RAG_CONTAINER_DATABASE_URL in .env}
      RAG_MIGRATIONS_PATH: /app/migrations
      RAG_DENSE_MODEL: ${RAG_DENSE_MODEL:-bge-small}
      RAG_EMBEDDER_ID: ${RAG_EMBEDDER_ID:-bge-small-en-v1.5}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      RAG_GENERATION_BACKEND: ${RAG_GENERATION_BACKEND:-deepseek-flash}
      RAG_QUERY_INSTRUCTION: ${RAG_QUERY_INSTRUCTION:-true}
      RAG_METADATA_PREFIXED_EMBEDDINGS: ${RAG_METADATA_PREFIXED_EMBEDDINGS:-false}
      RAG_FUSION_METHOD: ${RAG_FUSION_METHOD:-rrf}
      RAG_PARENT_EXPANSION: ${RAG_PARENT_EXPANSION:-true}
      RAG_EXTRACTIVE_MINIMUM_SCORE: ${RAG_EXTRACTIVE_MINIMUM_SCORE:-0.0}
      RAG_JWT_ALGORITHM: ${RAG_JWT_ALGORITHM:-HS256}
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?copy .env.example to .env and set RAG_JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - type: bind
        source: ${HF_CACHE_DIR:?set HF_CACHE_DIR in .env}
        target: /cache/huggingface
        read_only: true
    networks:
      - final_network
      - evidence_rag_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "rag_service.storage.worker"]
    environment:
      RAG_ENV: ${RAG_ENV:-development}
      RAG_LOG_LEVEL: ${RAG_LOG_LEVEL:-INFO}
      RAG_STORAGE_BACKEND: postgres
      RAG_DATABASE_URL: ${RAG_CONTAINER_DATABASE_URL:?set RAG_CONTAINER_DATABASE_URL in .env}
      RAG_MIGRATIONS_PATH: /app/migrations
      RAG_DENSE_MODEL: ${RAG_DENSE_MODEL:-bge-small}
      RAG_EMBEDDER_ID: ${RAG_EMBEDDER_ID:-bge-small-en-v1.5}
      RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L6-v2}
      RAG_GENERATION_BACKEND: ${RAG_GENERATION_BACKEND:-deepseek-flash}
      RAG_QUERY_INSTRUCTION: ${RAG_QUERY_INSTRUCTION:-true}
      RAG_METADATA_PREFIXED_EMBEDDINGS: ${RAG_METADATA_PREFIXED_EMBEDDINGS:-false}
      RAG_FUSION_METHOD: ${RAG_FUSION_METHOD:-rrf}
      RAG_PARENT_EXPANSION: ${RAG_PARENT_EXPANSION:-true}
      RAG_EXTRACTIVE_MINIMUM_SCORE: ${RAG_EXTRACTIVE_MINIMUM_SCORE:-0.0}
      RAG_JWT_ALGORITHM: ${RAG_JWT_ALGORITHM:-HS256}
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?copy .env.example to .env and set RAG_JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /cache/huggingface/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - type: bind
        source: ${HF_CACHE_DIR:?set HF_CACHE_DIR in .env}
        target: /cache/huggingface
        read_only: true
    networks:
      - final_network
      - evidence_rag_default
    restart: unless-stopped

  ui:
    build: .
    command: ["streamlit", "run", "src/rag_service/ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports:
      - "127.0.0.1:${RAG_FINAL_UI_PORT:-18511}:8501"
    environment:
      RAG_UI_API_URL: http://api:8000
      RAG_JWT_SECRET: ${RAG_JWT_SECRET:?copy .env.example to .env and set RAG_JWT_SECRET}
    networks:
      - final_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  final_network:
  evidence_rag_default:
    external: true
    name: evidence-rag_default
