services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: evidence_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evidence_rag"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_ENV: development
      RAG_LOG_LEVEL: INFO
      RAG_STORAGE_BACKEND: postgres
      RAG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evidence_rag
      RAG_MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "rag_service.storage.worker"]
    environment:
      RAG_ENV: development
      RAG_LOG_LEVEL: INFO
      RAG_STORAGE_BACKEND: postgres
      RAG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/evidence_rag
      RAG_MIGRATIONS_PATH: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
